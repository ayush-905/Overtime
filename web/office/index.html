<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overtime</title>
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <!-- settings -->
  <script>
    // Apply the saved theme before the first paint so the page never flashes.
    try {
      const t = localStorage.getItem('overtime-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      // The same text size and colour theme as the dashboard.
      const text = localStorage.getItem('overtime-text');
      if (text) document.documentElement.dataset.text = text;
      const palette = JSON.parse(localStorage.getItem('overtime-palette') || 'null');
      if (palette?.theme && palette.vars) {
        document.documentElement.dataset.palette = palette.theme;
        for (const [k, v] of Object.entries(palette.vars)) if (/^--p-[a-z-]+$/.test(k)) document.documentElement.style.setProperty(k, String(v));
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/office/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo"><img src="/shared/favicon.svg" alt="" width="22" height="22"></span>
      <h1>Overtime</h1>
      <div id="summary" class="top-status" aria-live="polite"></div>
    </div>
    <div class="top-right">
      <a class="icon-btn" href="/" data-tip="Limits, spend and insights">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="9" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.8"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.8"/><rect x="3" y="15" width="7.5" height="6" rx="1.8"/></svg>
        <span class="btn-label">Dashboard</span>
      </a>
      <span id="conn" class="conn" data-tip="Connecting to Overtime's server…"><i></i><span id="conn-label">Connecting</span><time id="clock"></time></span>
      <div id="theme" class="theme" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" data-tip="Light" aria-label="Light">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
        <button type="button" data-theme-choice="auto" aria-pressed="true" data-tip="Match your system" aria-label="Match your system">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></svg>
        </button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" data-tip="Dark" aria-label="Dark">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8 8 0 1 1 9.8 4a6.5 6.5 0 0 0 10.2 10.2z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- The pixel office, who is doing what, and the live activity feed. -->
  <main class="layout">
    <section class="floor">
      <div id="chips" class="chips" role="toolbar" aria-label="Filter by project" hidden></div>
      <div id="stage" class="stage">
        <div id="wrap" class="wrap">
          <canvas id="office" role="img" aria-label="Pixel-art office showing your coding agents at work"></canvas>
          <div id="labels" class="labels"></div>
          <div id="empty" class="empty" hidden>
            <div class="empty-card">
              <strong>The office is empty</strong>
              <p>Start a Claude Code or Codex session and your agent walks in through the door.</p>
              <a href="/office/?demo">Watch a demo</a>
            </div>
          </div>
        </div>
      </div>
      <p id="legend" class="legend" aria-label="What the colors and stations mean"></p>
      <section class="feed-box" aria-label="Recent activity">
        <h2>Activity</h2>
        <ol id="feed" class="feed"></ol>
      </section>
    </section>

    <aside class="sidebar" aria-label="Agents">
      <div id="agents"></div>
      <footer class="foot">Reading <code id="watching">~/.claude/projects</code> on this machine. Nothing leaves it from this page.</footer>
    </aside>
  </main>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="/office/app.js"></script>
</body>
</html>
